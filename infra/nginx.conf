# Reverse proxy: TLS termination, /api → Node API (direct, no Next hop), everything else → Next.
# Replace server_name and certificate paths for your domain (see docs/operations-runbook.md).
upstream zuno_web { server web:3000; keepalive 32; }
upstream zuno_api { server api:4000; keepalive 64; }

limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=30r/s;

server {
  listen 80;
  server_name _;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

  client_max_body_size 512k;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-Id $request_id;

  # Audio: stream straight through (no buffering), honour Range, long reads.
  location /api/v1/stream/ {
    limit_req zone=api_per_ip burst=60 nodelay;
    proxy_pass http://zuno_api;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
  }

  location /api/ {
    limit_req zone=api_per_ip burst=40 nodelay;
    proxy_pass http://zuno_api;
    proxy_read_timeout 30s;
  }

  location = /sw.js { proxy_pass http://zuno_web; add_header Cache-Control "no-cache"; }
  location /_next/static/ { proxy_pass http://zuno_web; add_header Cache-Control "public, max-age=31536000, immutable"; }
  location / { proxy_pass http://zuno_web; }
}
