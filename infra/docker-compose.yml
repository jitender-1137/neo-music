# Local development dependencies. Production uses managed equivalents (see docs/operations-runbook.md).
name: zuno2
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: zuno
      POSTGRES_PASSWORD: zuno_dev_password
      POSTGRES_DB: zuno
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zuno -d zuno"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
