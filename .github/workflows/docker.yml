# Builds the Neo Music server images and publishes them to GitHub Container Registry:
#   ghcr.io/jitender-1137/neo-music       (ALL-IN-ONE: website + API + Caddy HTTPS, in-memory DB)
#   ghcr.io/jitender-1137/neo-music-api   (API + worker + migrations, for the multi-container setup)
#   ghcr.io/jitender-1137/neo-music-web   (Next.js website, for the multi-container setup)
#   ghcr.io/jitender-1137/neo-music-ytmusicapi (ytmusicapi helper, for the multi-container setup)
# Both for linux/arm64 (Oracle Ampere) and linux/amd64. Tags: latest (main) and sha-<commit>.
# Publishing uses the workflow's own GITHUB_TOKEN — no personal credentials. Images carry no
# secrets or domain: everything server-specific comes from infra/.env at run time.
name: Docker images
on:
  push:
    branches: [main]
    paths: ["apps/api/**", "apps/web/**", "packages/**", "services/**", "infra/Dockerfile.*", "infra/allinone/**", "pnpm-lock.yaml", ".github/workflows/docker.yml"]
  workflow_dispatch:

concurrency:
  group: "docker-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: allinone, image: neo-music, dockerfile: infra/Dockerfile.allinone }
          - { name: api, image: neo-music-api, dockerfile: infra/Dockerfile.api }
          - { name: web, image: neo-music-web, dockerfile: infra/Dockerfile.web }
          - { name: ytmusicapi, image: neo-music-ytmusicapi, dockerfile: infra/Dockerfile.ytmusicapi }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
